# mixforge.okemily.com: static client baked into the image; /ws -> room_server (same pod), /api/ -> in-cluster IDUNA,
# /room-cache/ -> the emptyDir the room server downloads yt-dlp audio into.
types { application/javascript mjs; text/javascript js; application/wasm wasm; }
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /room-cache/ { alias /run/mixforge/cache/; }
    location /ws {
        proxy_pass http://127.0.0.1:8973;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://iduna:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
