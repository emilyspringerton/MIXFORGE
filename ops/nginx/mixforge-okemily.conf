# mixforge.okemily.com -- MIXFORGE's own dedicated domain. Founder real-time, 2026-09-27:
# "lets get MIXFORGE live mixforge.okemily.com". Serves the real, live MIXFORGE client directly
# from this repo checkout: web/index.html (hub page), web/dj.html (the real 4-deck mixer + 16-pad
# MIDI sampler, PARENA DSP compiled to dsp.wasm, no server needed), and web/multiplayer.html (the
# live DJ-room, turn order from room.wasm) -- with /ws proxied to the real
# server/room_server.mjs WebSocket process (ops/systemd/mixforge-room-server.service,
# 127.0.0.1:8973 -- loopback-only by design, this vhost is the real gate, same "reverse proxy is
# the edge" split jewel-jupyter.service/sarena-notebook.service already establish elsewhere in
# this monorepo).
#
# DNS: managed by Terraform (IDUNA/ops/terraform/main.tf, cloudflare_dns_record.mixforge) --
# apply that first and wait for it to propagate before running certbot below:
#   export TF_VAR_cloudflare_api_token="$(grep -oP '^cfat_[A-Za-z0-9]+' /home/fatbaby/EMILY/var/cloudflare.md | head -1)"
#   cd /home/fatbaby/IDUNA/ops/terraform && terraform init && terraform plan && terraform apply
#   dig +short mixforge.okemily.com   # should return 198.58.107.85 before continuing
#
# Deploy (see sudo-queue/92-mixforge-okemily-domain.sh for the full, numbered script):
#   sudo cp mixforge-okemily.conf /etc/nginx/sites-available/mixforge
#   sudo ln -sf /etc/nginx/sites-available/mixforge /etc/nginx/sites-enabled/mixforge
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mixforge.okemily.com   # issues the cert, rewrites this file in place
#                                                   # to add the "managed by Certbot" SSL block,
#                                                   # same as every other *.okemily.com vhost here.
#
# Reminder: after any future certbot re-run, diff the live
# /etc/nginx/sites-available/mixforge against this file and copy the live version back into the
# repo if they've diverged -- same lesson OKEMILY/CLAUDE.md documents for okemily.com's own config.

server {
    server_name mixforge.okemily.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # IDUNA API, same-origin proxy -- same convention WOTAN/OKEMILY/CarePyre already use
    # (ops/nginx-wotan.conf etc.) rather than a cross-origin fetch + CORS. S513's "save to your
    # IDUNA SSO account" recorder feature calls /api/v1/games/mixforge/recordings from
    # web/recorder.mjs through this same-origin path, and reads the SSO login redirect's token
    # from a URL fragment (no fetch involved there, so no CORS question either way).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real seat/turn WebSocket state -- proxied to the real room_server.mjs process. Upgrade
    # headers are required here (unlike the plain static location below) since this is a
    # long-lived WebSocket connection, not a request/response HTTP call.
    location /ws {
        proxy_pass http://127.0.0.1:8973;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ES module scripts (dj.html imports engine.mjs/demo_content.mjs as `<script type="module">`)
    # only execute if the server declares a JS MIME type -- stock nginx `mime.types` has no `.mjs`
    # entry, so without this block they're served as application/octet-stream and every browser
    # refuses to run them (silently: the page renders, nothing on it works). Found live 2026-09-27
    # -- "we have the affordances but it doesn't actually work yet, start audio button etc does
    # not work" turned out to be zero JS ever executing, not an audio-specific bug.
    location ~ \.mjs$ {
        root /home/fatbaby/MIXFORGE/web;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Static MIXFORGE client -- served straight from this repo checkout, no build step, no
    # separate deploy copy. index.html is the real, current hub page (links out to both dj.html,
    # the 4-deck mixer/sampler, and multiplayer.html, the live room) -- it stays the default
    # document rather than picking one of the two features to land on directly.
    location / {
        root /home/fatbaby/MIXFORGE/web;
        index index.html;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mixforge.okemily.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mixforge.okemily.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mixforge.okemily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name mixforge.okemily.com;
    return 404; # managed by Certbot
}
